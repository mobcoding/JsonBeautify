<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON Beautify - 格式化工具</title>
    <link rel="stylesheet" href="panel.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <img src="../assets/icon-32.png" alt="" class="brand-icon">
          <strong>JSON Beautify</strong>
        </div>
        <div class="app-actions">
          <button class="header-button" id="sampleData" type="button">示例</button>
          <button class="header-button" id="clearInput" type="button">清空</button>
          <button class="icon-button" id="openOptions" type="button" aria-label="打开设置" title="打开设置">⚙</button>
        </div>
      </header>

      <nav class="mode-tabs" aria-label="工具模式" role="tablist">
        <button class="mode-tab active" data-workspace="format" role="tab" aria-selected="true">格式化</button>
        <button class="mode-tab" data-workspace="compare" role="tab" aria-selected="false">对比</button>
        <button class="mode-tab" data-workspace="escape" role="tab" aria-selected="false">转义</button>
        <div class="format-options" data-format-options>
          <label>缩进
            <select id="indentSize">
              <option value="2">2 空格</option>
              <option value="4">4 空格</option>
              <option value="tab">Tab</option>
            </select>
          </label>
          <label class="sort-option"><input type="checkbox" id="sortKeysToggle"> 按键排序</label>
        </div>
      </nav>

      <div class="sub-actions" aria-label="当前模式操作">
        <div class="mode-actions active" data-actions="format">
          <button class="primary-action" id="formatNow" type="button">格式化</button>
          <button class="sub-button" id="minifyNow" type="button">压缩</button>
          <button class="sub-button" id="validateNow" type="button">验证</button>
        </div>
        <div class="mode-actions" data-actions="compare" hidden>
          <button class="primary-action" id="compareNow" type="button">开始比较</button>
        </div>
        <div class="mode-actions" data-actions="escape" hidden>
          <button class="primary-action" id="escapeNow" type="button">转义</button>
          <button class="sub-button" id="unescapeNow" type="button">去转义</button>
        </div>
      </div>

      <section class="workspace active" data-workspace="format" role="tabpanel">
        <div class="editor-pane">
          <div class="pane-header"><strong>输入 JSON</strong><span>支持注释、尾逗号和无引号 Key</span></div>
          <textarea id="inputText" spellcheck="false" placeholder="在此粘贴或输入 JSON"></textarea>
        </div>

        <div class="editor-pane result-pane" id="outputWrap">
          <div class="pane-header result-header">
            <strong>结果</strong>
            <div class="stats" id="statsBlock" hidden>
              <span><b id="statLines">0</b> 行</span>
              <span><b id="statBytes">0</b></span>
              <span><b id="statKeys">0</b> 键</span>
              <span><b id="statDepth">0</b> 层</span>
            </div>
            <div class="pane-actions">
              <button id="copyOutput" type="button">复制</button>
              <button id="downloadOutput" type="button">下载</button>
              <button id="swapToInput" type="button">送回输入</button>
            </div>
          </div>
          <div class="output-area" id="outputArea"><div id="outputText" class="code-output empty" tabindex="0">格式化结果会显示在这里</div></div>
        </div>
      </section>

      <section class="workspace compare-workspace" data-workspace="compare" role="tabpanel" hidden>
        <div class="editor-pane">
          <div class="pane-header"><strong>JSON A</strong></div>
          <textarea id="compareA" spellcheck="false" placeholder="粘贴第一份 JSON"></textarea>
        </div>
        <div class="editor-pane">
          <div class="pane-header"><strong>JSON B</strong></div>
          <textarea id="compareB" spellcheck="false" placeholder="粘贴第二份 JSON"></textarea>
        </div>
        <div class="compare-result-pane">
          <div class="pane-header"><strong>差异结果</strong><span>对象键顺序不影响比较</span></div>
          <textarea id="compareOutput" spellcheck="false" placeholder="差异结果会显示在这里" readonly></textarea>
        </div>
      </section>

      <section class="workspace" data-workspace="escape" role="tabpanel" hidden>
        <div class="editor-pane">
          <div class="pane-header"><strong>输入文本</strong><span>输入需要转义或去转义的文本</span></div>
          <textarea id="escapeInput" spellcheck="false" placeholder="输入任意文本"></textarea>
        </div>
        <div class="editor-pane">
          <div class="pane-header result-header"><strong>结果</strong><div class="pane-actions"><button id="copyEscapeOutput" type="button">复制</button></div></div>
          <textarea id="escapeOutput" spellcheck="false" placeholder="结果会显示在这里" readonly></textarea>
        </div>
      </section>

      <footer class="status-bar" aria-live="polite">
        <span id="statusDot" class="dot"></span>
        <strong id="statusTitle">准备就绪</strong>
        <span id="statusText">所有 JSON 数据仅在本机浏览器中处理。</span>
      </footer>
    </main>

    <script src="panel.js"></script>
  </body>
</html>
